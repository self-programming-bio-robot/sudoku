name: Android build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-28" "build-tools;30.0.2"'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Run unit tests and build the debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
