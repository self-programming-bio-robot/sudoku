// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.6.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:4.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.boox.com/repository/maven-public/"
            content {
                includeGroup "com.onyx.android.sdk"
            }
        }
        maven {
            url "https://repo.boox.com/repository/proxy-public/"
            content {
                // Legacy dependencies of onyxsdk-base 1.6.4.
                includeVersion "org.apache.commons.io", "commonsIO", "2.5.0"
                includeVersion "pub.devrel", "easypermissions", "0.2.1"
                includeVersion "com.tencent", "mmkv", "1.0.15"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
